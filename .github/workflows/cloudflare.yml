name: Cloudflare backend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: |
            cloudflare/package-lock.json
            cloudflare/backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix backend --no-audit --no-fund
      - run: npm run runtime:check --prefix backend
      - run: npm run types --prefix backend
      - run: npm run typecheck --prefix backend
      - run: npm test
      - run: npm test --prefix backend
      - name: Build the pinned Bubblewrap compatibility helper
        run: docker build --platform linux/amd64 --target bubblewrap-compat-build --file backend/Dockerfile .
      - name: Compile Linux security probes
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror backend/native/proc-guard.c -o /tmp/hivemind-proc-guard
          gcc -std=c11 -O2 -Wall -Wextra -Werror backend/native/namespace-probe.c -o /tmp/hivemind-namespace-probe
          gcc -std=c11 -O2 -Wall -Wextra -Werror backend/native/namespace-guard.c -o /tmp/hivemind-namespace-guard
